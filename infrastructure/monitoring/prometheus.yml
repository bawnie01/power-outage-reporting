global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - outage-service:8080
          - notification-service:8082
          - sms-partner-mock:8081

  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets:
          - kong:8001

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692
