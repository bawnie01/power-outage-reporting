name: Test and publish container images

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "demo-ui/**"
      - "compose.yaml"
      - "infrastructure/monitoring/**"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "services/**"
      - "demo-ui/**"
      - "compose.yaml"
      - "infrastructure/monitoring/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-monitoring:
    name: Validate monitoring configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Grafana dashboard JSON
        run: jq empty infrastructure/monitoring/grafana/dashboards/power-outage-overview.json

  test-ui:
    name: Build demo UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build browser interface image
        run: docker build --tag power-outage/demo-ui:ci demo-ui

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: outage_db
          POSTGRES_USER: outage_user
          POSTGRES_PASSWORD: outage_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outage_user -d outage_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: outage_user
          RABBITMQ_DEFAULT_PASS: outage_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/outage_db
      DATABASE_USERNAME: outage_user
      DATABASE_PASSWORD: outage_password
      RABBITMQ_HOST: localhost
      RABBITMQ_USERNAME: outage_user
      RABBITMQ_PASSWORD: outage_password
    strategy:
      fail-fast: false
      matrix:
        service:
          - outage-service
          - notification-service
          - sms-partner-mock
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: ./mvnw --batch-mode verify

  publish:
    name: Publish ${{ matrix.service }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - outage-service
          - notification-service
          - sms-partner-mock
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
