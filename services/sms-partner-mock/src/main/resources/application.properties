spring.application.name=sms-partner-mock
server.port=8081
sms.mock.timeout-delay-ms=${SMS_MOCK_TIMEOUT_DELAY_MS:5000}
sms.partner.api-key=${SMS_PARTNER_API_KEY:local-demo-partner-key}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
