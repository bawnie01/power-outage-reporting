spring.application.name=notification-service
server.port=8082
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/outage_db}
spring.datasource.username=${DATABASE_USERNAME:outage_user}
spring.datasource.password=${DATABASE_PASSWORD:outage_password}
spring.flyway.enabled=true
spring.flyway.table=notification_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:outage_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:outage_password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5000ms
sms.partner.base-url=${SMS_PARTNER_BASE_URL:http://localhost:8081}
sms.partner.mock-scenario=${SMS_PARTNER_MOCK_SCENARIO:success}
sms.partner.api-key=${SMS_PARTNER_API_KEY:local-demo-partner-key}
sms.partner.connect-timeout=${SMS_PARTNER_CONNECT_TIMEOUT:2s}
sms.partner.read-timeout=${SMS_PARTNER_READ_TIMEOUT:3s}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
