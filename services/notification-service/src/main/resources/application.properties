spring.application.name=notification-service
server.port=8082
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:outage_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:outage_password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5000ms
sms.partner.base-url=${SMS_PARTNER_BASE_URL:http://localhost:8081}
sms.partner.mock-scenario=${SMS_PARTNER_MOCK_SCENARIO:success}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
