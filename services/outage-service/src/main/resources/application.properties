spring.application.name=outage-service
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/outage_db}
spring.datasource.username=${DATABASE_USERNAME:outage_user}
spring.datasource.password=${DATABASE_PASSWORD:outage_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
