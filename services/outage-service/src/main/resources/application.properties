spring.application.name=outage-service
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/outage_db}
spring.datasource.username=${DATABASE_USERNAME:outage_user}
spring.datasource.password=${DATABASE_PASSWORD:outage_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:outage_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:outage_password}
outbox.publish-interval=${OUTBOX_PUBLISH_INTERVAL:2s}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8083/realms/power-outage}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8083/realms/power-outage/protocol/openid-connect/certs}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
