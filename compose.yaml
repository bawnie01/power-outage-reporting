services:
  postgres:
    image: postgres:17-alpine
    container_name: power-outage-postgres
    environment:
      POSTGRES_DB: outage_db
      POSTGRES_USER: outage_user
      POSTGRES_PASSWORD: outage_password
    ports:
      - "5432:5432"
    volumes:
      - outage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outage_user -d outage_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: power-outage-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: outage_user
      RABBITMQ_DEFAULT_PASS: outage_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - outage-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  outage-postgres-data:
  outage-rabbitmq-data:
