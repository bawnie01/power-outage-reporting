services:
  outage-service:
    build:
      context: ./services/outage-service
    image: power-outage/outage-service:local
    container_name: power-outage-outage-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/outage_db
      DATABASE_USERNAME: outage_user
      DATABASE_PASSWORD: outage_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: outage_user
      RABBITMQ_PASSWORD: outage_password
      KEYCLOAK_ISSUER_URI: http://localhost:8083/realms/power-outage
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/power-outage/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kong:
    image: kong:3.9.3
    container_name: power-outage-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./infrastructure/kong/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      outage-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  notification-service:
    build:
      context: ./services/notification-service
    image: power-outage/notification-service:local
    container_name: power-outage-notification-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/outage_db
      DATABASE_USERNAME: outage_user
      DATABASE_PASSWORD: outage_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: outage_user
      RABBITMQ_PASSWORD: outage_password
      SMS_PARTNER_BASE_URL: http://sms-partner-mock:8081
      SMS_PARTNER_MOCK_SCENARIO: success
      SMS_PARTNER_API_KEY: local-demo-partner-key
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sms-partner-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sms-partner-mock:
    build:
      context: ./services/sms-partner-mock
    image: power-outage/sms-partner-mock:local
    container_name: power-outage-sms-partner-mock
    environment:
      SMS_MOCK_TIMEOUT_DELAY_MS: 5000
      SMS_PARTNER_API_KEY: local-demo-partner-key
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: power-outage-keycloak
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8083:8080"
    volumes:
      - ./infrastructure/keycloak/power-outage-realm.json:/opt/keycloak/data/import/power-outage-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: power-outage-postgres
    environment:
      POSTGRES_DB: outage_db
      POSTGRES_USER: outage_user
      POSTGRES_PASSWORD: outage_password
    ports:
      - "5432:5432"
    volumes:
      - outage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outage_user -d outage_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: power-outage-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: outage_user
      RABBITMQ_DEFAULT_PASS: outage_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - outage-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  outage-postgres-data:
  outage-rabbitmq-data:
