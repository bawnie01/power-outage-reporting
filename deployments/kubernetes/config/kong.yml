_format_version: "3.0"
_transform: true

services:
  - name: outage-service
    url: http://outage-service:8080
    routes:
      - name: outage-reports-route
        paths:
          - /api/v1/outage-reports
        strip_path: false

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid
      echo_downstream: true
  - name: rate-limiting
    config:
      minute: 30
      policy: local
  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes
  - name: cors
    config:
      origins: ["*"]
      methods: [GET, POST, OPTIONS]
      headers: [Authorization, Content-Type, Idempotency-Key, X-Correlation-Id]
      exposed_headers: [Location, X-Correlation-Id]
      credentials: false
      max_age: 3600
  - name: prometheus
